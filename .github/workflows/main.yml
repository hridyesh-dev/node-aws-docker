name: CICD

on:
  push:
    branches: [cicd-docker-ec2]
    
jobs:
  build:
    #login to docker hub create a docker image and push it to docker hub 
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Login To Docker Hub 
        run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_PASSWORD}}
      - name: Build Docker Image
        run: docker build -t  hri03/nodejs-app . 
      - name: Build Docker Image to DockerHub
        run: docker push   hri03/nodejs-app:latest 

  #once image is built run it on ec2 
  deploy:
    needs: build
    runs-on: self-hosted
    steps: 
      - name: Pull Image From Docker Hub 
        run: docker pull hri03/nodejs-app:latest
      - name: Delete Old Containers if any
        run:  docker rm -f nodejs-app-container
      - name: Run docker container
        run:  docker run -d -p 5000:5000 --name nodejs-app-container hri03/nodejs-app

